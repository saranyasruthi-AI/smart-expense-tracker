<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>💰 Smart Expense Tracker</h1>
        <p>Track your income & expenses easily</p>
    </div>

    <div class="welcome-card">
        <label>Your Name</label>
        <input type="text" id="username" placeholder="Enter Your Name">
    </div>

    <div class="summary">

        <div class="card income-card">
            <h3>💚 Income</h3>
            <h2 id="income">₹0</h2>
        </div>

        <div class="card expense-card">
            <h3>❤️ Expense</h3>
            <h2 id="expense">₹0</h2>
        </div>

        <div class="card balance-card">
            <h3>💙 Balance</h3>
            <h2 id="balance">₹0</h2>
        </div>

    </div>

    <div class="transaction-box">

        <h2>Add Transaction</h2>

        <input type="number" id="amount" placeholder="Enter Amount">

        <select id="type">
            <option value="">Select Type</option>
            <option value="Income">💰 Income</option>
            <option value="Expense">💸 Expense</option>
        </select>

        <select id="category">

            <option value="">Select Category</option>

            <optgroup label="Income">

                <option>💼 Salary</option>
                <option>💵 Freelancing</option>
                <option>🎁 Gift</option>
                <option>📈 Investment</option>
                <option>🏦 Interest</option>
                <option>💸 Refund</option>
                <option>🛍 Cashback</option>
                <option>📦 Other Income</option>

            </optgroup>

            <optgroup label="Expense">

                <option>🍔 Food</option>
                <option>🚌 Transport</option>
                <option>🛒 Shopping</option>
                <option>🏠 Rent</option>
                <option>💡 Electricity</option>
                <option>📱 Recharge</option>
                <option>🌐 Internet</option>
                <option>⛽ Fuel</option>
                <option>💊 Medical</option>
                <option>📚 Education</option>
                <option>🎬 Entertainment</option>
                <option>👕 Clothing</option>
                <option>✈️ Travel</option>
                <option>🎁 Gifts</option>
                <option>📦 Other Expense</option>

            </optgroup>

        </select>

        <input type="text" id="desc" placeholder="Notes (Optional)">
                <div class="buttons">

            <button onclick="addIncome()">
                ➕ Add Income
            </button>

            <button onclick="addExpense()">
                ➖ Add Expense
            </button>

        </div>

    </div>

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="🔍 Search Transaction"
            onkeyup="searchTransaction()">

    </div>

    <div class="history">

        <h2>📜 Transaction History</h2>

        <ul id="list"></ul>

    </div>


    


<div class="chart-container">
    <h2>📊 Financial Overview</h2>
    <canvas id="expenseChart"></canvas>
</div>

<div class="export-buttons">
    <button id="pdfBtn">📄 Download PDF</button>
    <button id="csvBtn">📑 Export CSV</button>
</div>

</div> 
<!-- container end -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<script src="script.js"></script>

</body>
</html>
</body>

</html>
